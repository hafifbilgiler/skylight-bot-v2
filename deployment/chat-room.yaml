apiVersion: v1
kind: Namespace
metadata:
  name: onebune-chat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-chat
  namespace: onebune-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-chat
  template:
    metadata:
      labels:
        app: community-chat
    spec:
      containers:
      - name: community-chat
        image: docker.io/hafifbilgiler/community-chat:1.0
        ports:
        - containerPort: 8001
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: onebune-chat-secrets
              key: jwt-secret
        - name: COMMUNITY_DB_URL
          valueFrom:
            secretKeyRef:
              name: onebune-chat-secrets
              key: community-db-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: onebune-chat-secrets
              key: redis-url
        - name: GEMINI_PROJECT
          valueFrom:
            secretKeyRef:
              name: onebune-chat-secrets
              key: gemini-project
        - name: GEMINI_LOCATION
          valueFrom:
            secretKeyRef:
              name: onebune-chat-secrets
              key: gemini-location
        - name: GEMINI_MODEL
          valueFrom:
            secretKeyRef:
              name: onebune-chat-secrets
              key: gemini-model
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secrets/key.json
        volumeMounts:
        - name: vertex-sa
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: vertex-sa
        secret:
          secretName: vertex-sa-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: community-chat-svc
  namespace: onebune-chat
spec:
  selector:
    app: community-chat
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30301
  type: NodePort