# Orkestratör — gateway ile aynı namespace, aynı JWT secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skylight-k8s-lab
  namespace: skylight-bot-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skylight-k8s-lab
  template:
    metadata:
      labels:
        app: skylight-k8s-lab
    spec:
      serviceAccountName: lab-orchestrator
      containers:
      - name: orchestrator
        image: docker.io/hafifbilgiler/skylight-k8s-lab:3.4
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: IN_CLUSTER
          value: "true"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: jwt-secret
        # ── AI Mentor (DeepInfra) ──
        - name: DEEPINFRA_API_KEY
          value: "4hcNLCkZvisyP6wuD2sdY5NPFU2GjBSn"
        - name: DEEPINFRA_MODEL
          value: "meta-llama/Meta-Llama-3.1-70B-Instruct"
        # ── Premium kontrolü için DB (gateway ile aynı PostgreSQL) ──
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: pg-secret
              key: dbname
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: pg-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-secret
              key: password
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: skylight-k8s-lab
  namespace: skylight-bot-v2
spec:
  selector:
    app: skylight-k8s-lab
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30302
  type: NodePort